<!doctype html>
<html lang="zh-CN">
  <body style="margin: 0; background: #f5f7f4; color: #20251f; font-family: Arial, 'Microsoft YaHei', sans-serif;">
    <div style="max-width: 520px; margin: 0 auto; padding: 40px 20px;">
      <div style="padding: 30px; border: 1px solid #e1e7df; border-radius: 12px; background: #ffffff;">
        <p style="margin: 0 0 8px; color: #1e5b43; font-size: 14px; font-weight: 700;">小盘</p>
        <h2 style="margin: 0 0 16px; font-size: 24px;">注册验证码</h2>
        <p style="margin: 0 0 18px; color: #60685e; line-height: 1.7;">
          请输入以下 8 位验证码完成注册：
        </p>
        <p style="margin: 0 0 18px; color: #1e5b43; font-size: 30px; font-weight: 700; letter-spacing: 8px;">
          {{ .Token }}
        </p>
        <p style="margin: 0; color: #7b8378; font-size: 13px; line-height: 1.7;">
          验证码将在短时间后失效，请勿转发。若不是你本人操作，可以忽略此邮件。
        </p>
      </div>
    </div>
  </body>
</html>
